<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Widget Demo</title>
<link rel="stylesheet" href="clock-ui.local.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030a32;
  }
  #analog-clock-dark {
    width: 12rem;
    height: 12rem;
  }
</style>
</head>
<body>

  <div id="analog-clock-dark"></div>

  <script src="clock-ui.local.js"></script>
  <script>
    new ClockUI.LiveClockUI("#analog-clock-dark", {
      hideSeconds: false,
      useRoman: false,
      dualTone: true,
      smoothSweep: true
    });
  </script>

</body>
</html>
